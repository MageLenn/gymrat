<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>GymRat</title>
  <meta name="theme-color" content="#121016">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymRat">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <h1 id="viewTitle">GymRat</h1>
    <div id="topAction"></div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Hauptnavigation">
    <button data-tab="start" class="tab"><span class="ti" data-icon="home"></span><span>Start</span></button>
    <button data-tab="training" class="tab"><span class="ti" data-icon="play"></span><span>Training</span></button>
    <button data-tab="geraete" class="tab"><span class="ti" data-icon="dumbbell"></span><span>Geräte</span></button>
    <button data-tab="info" class="tab"><span class="ti" data-icon="info"></span><span>Info</span></button>
    <button data-tab="statistik" class="tab"><span class="ti" data-icon="chart"></span><span>Statistik</span></button>  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="icons.js"></script>
  <script src="seed.js"></script>
  <script src="body.js"></script>
  <script src="app.js"></script>
</body>
</html>
